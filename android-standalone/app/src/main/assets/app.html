<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DeepSeek Mobile</title>
<style>
:root{
  --bg:#09090b; --panel:#111114; --panel2:#17171c; --line:#25252d; --line2:#30303a;
  --text:#ececf1; --muted:#8c8c99; --dim:#666672; --accent:#9be7b4; --accent2:#6fd39a;
  --danger:#ff7b7b; --user:#1d2a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;font-size:14px;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#top{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:rgba(9,9,11,.96);position:relative;z-index:20}
.logo{width:32px;height:32px;border-radius:9px;background:#000;border:1px solid #2c2c34;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-1px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;max-width:150px;overflow:hidden}
.brand b{font-size:14px;letter-spacing:.2px}
.brand small{font-size:9px;color:var(--dim);margin-top:3px;white-space:nowrap}
.spacer{flex:1}
.iconbtn{width:32px;height:32px;flex:0 0 32px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
.iconbtn:active{background:#202027}
.modechip{font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid #2d3a32;background:#121a15;color:#a9e9be;white-space:nowrap;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
#subbar{flex:0 0 auto;border-bottom:1px solid var(--line);background:#0b0b0e}
.modes{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 7px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:0 0 auto;border:1px solid var(--line);background:#121216;color:#9c9caa;border-radius:8px;padding:6px 10px;font-size:11.5px;line-height:1;white-space:nowrap}
.modes button.active{color:#dfffe9;border-color:#3a5d47;background:#142118}
.modes button small{display:block;font-size:9px;color:#6d8375;margin-top:4px;font-weight:400}
.modes button.active small{color:#8eb79c}
.wsbar{display:flex;align-items:center;gap:6px;padding:6px 12px 7px;font-size:10.5px;color:#7d8b83;border-top:1px solid #17171c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsbar b{font-weight:500;color:#a8b9ae;overflow:hidden;text-overflow:ellipsis}
.wsbar span{margin-left:auto;color:#6f8d7a;flex:0 0 auto}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#chat{flex:1;overflow-y:auto;padding:18px 16px 130px;scroll-behavior:smooth}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 20px}
.empty .orb{width:74px;height:74px;border-radius:22px;border:1px solid #2b3a30;background:radial-gradient(circle at 40% 30%,#1d3326,#0c100e 70%);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--accent);margin-bottom:20px;box-shadow:0 0 40px rgba(80,200,130,.09)}
.empty h1{font-size:23px;margin:0 0 8px;font-weight:650;letter-spacing:.2px}
.empty p{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 18px;max-width:320px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--panel);color:#d5d5df;border-radius:11px;padding:10px 11px;font-size:12px;line-height:1.3}
.quick button b{display:block;font-size:11.5px;font-weight:600;color:#e0e0e8;margin-bottom:3px}
.quick button small{display:block;font-size:9.5px;color:#777784;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick button:active{background:#1c1c22}
.msg{display:flex;margin:0 0 20px;gap:10px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.avatar{width:27px;height:27px;flex:0 0 27px;border-radius:8px;background:#0b0f0c;border:1px solid #24352a;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800;font-size:13px;margin-top:2px}
.bubble{max-width:82%;border-radius:14px;padding:11px 13px;line-height:1.65;font-size:13.5px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.msg.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px;color:#e4e4ea}
.msg.user .bubble{background:var(--user);border:1px solid #294235;border-top-right-radius:5px;color:#e9fff0}
.tools{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.tool{font-size:11px;color:#a9cdb7;background:#101a14;border:1px solid #24372b;border-radius:7px;padding:5px 8px;display:flex;gap:6px;align-items:flex-start}
.tool b{font-weight:600;color:#cdeed9;flex:0 0 auto}
.tool span{color:#7e9c88;word-break:break-all}
.worklog{margin:-8px 0 14px 37px;display:flex;gap:8px;align-items:flex-start;color:#8fa99a;font-size:11.5px;line-height:1.5}
.worklog .wdot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#6ea887;margin-top:5px;box-shadow:0 0 0 3px rgba(110,168,135,.08)}
.worklog .wtext{flex:1;word-break:break-word;white-space:pre-wrap}
.worklog .wtime{color:#58685f;flex:0 0 auto;font-size:10px}
.worklog.done .wdot{background:#54c28a}.worklog.error .wdot{background:#d36b6b}.worklog.stop .wdot{background:#d8b36b}.worklog.think .wdot{background:#69a9d6}
.proc{margin:6px 0 0 42px;max-width:calc(100% - 42px)}
.proc summary{cursor:pointer;color:#a9cdb7;font-size:12px;padding:7px 10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:10px;list-style:none}
.proc summary::-webkit-details-marker{display:none}
.proc summary:before{content:"▸ ";color:#6ea887}
.proc[open] summary:before{content:"▾ "}
.proc .pstep{display:flex;gap:8px;padding:6px 10px;color:#8fa99a;font-size:11.5px;border-bottom:1px solid rgba(255,255,255,.04)}
.proc .pstep .pk{flex:0 0 auto;color:#69a9d6;min-width:48px}
.proc .pstep .pt{flex:1;white-space:pre-wrap;word-break:break-word}
.prow{border-bottom:1px solid rgba(255,255,255,.06);padding:2px 0}
.prow summary{list-style:none;cursor:pointer;padding:7px 0;color:#8fa99a;font-size:11.5px}
.prow summary::-webkit-details-marker{display:none}
.prow .ptop{display:flex;gap:9px;align-items:flex-start}
.prow .picon{width:24px;height:24px;flex:0 0 24px;border-radius:8px;background:#18241c;color:#9be7b4;display:flex;align-items:center;justify-content:center;font-size:11px}
.prow .ptitle{flex:1;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.prow .ptime{flex:0 0 auto;color:#58685f;font-size:10px;padding-top:3px}
.prow .pdetail{margin:0 0 8px 33px;padding:9px 11px;background:rgba(255,255,255,.035);border-radius:8px;color:#c7d8cd;font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msgbody{min-width:0;max-width:calc(100% - 37px);flex:1}
.runhead{display:flex;align-items:center;gap:7px;width:100%;border:1px solid #2a2a33;background:#121216;border-radius:9px;padding:8px 10px;margin:0 0 7px;color:#8d8d99;font-size:11.5px;text-align:left}
.runhead b{color:#b7b7c2;font-weight:500}.runhead .dur{margin-left:auto;color:#7f8f85}
#processSheet{position:fixed;inset:0;z-index:82;background:rgba(0,0,0,.58);display:none;align-items:flex-end;justify-content:center;padding:0}
#processSheet.show{display:flex}
#processSheet .pbox{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:#111116;border:1px solid #30303a;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.55)}
#processSheet .phead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#111116;padding:2px 0 10px;z-index:2}
#processSheet .phead h3{font-size:14px;margin:0;flex:1;text-align:center}
#processSheet .pclose{border:0;background:transparent;color:#aaa;font-size:18px;width:28px;height:28px}
.pstep{margin:7px 0;border:1px solid #25252d;background:#15151a;border-radius:10px;overflow:hidden}
.pstep .ptop{display:flex;gap:8px;align-items:flex-start;padding:9px 10px}
.pstep .picon{width:20px;flex:0 0 20px;height:20px;border-radius:5px;background:#1c2a22;color:#9be7b4;display:flex;align-items:center;justify-content:center;font-size:11px}
.pstep .ptitle{font-size:11.5px;line-height:1.5;color:#c8c8d2;flex:1;white-space:pre-wrap;word-break:break-word}
.pstep .ptime{font-size:9.5px;color:#646470;flex:0 0 auto}
.pstep details{border-top:1px solid #24242c}
.pstep details summary{cursor:pointer;padding:6px 10px;font-size:10.5px;color:#8fa99a;list-style:none}
.pstep details pre{margin:0;padding:8px 10px;white-space:pre-wrap;word-break:break-word;color:#a9cdb7;background:#0d0f0e;font:10px/1.5 ui-monospace,Menlo,monospace;max-height:260px;overflow:auto}
#modelPick{border:1px solid #2b3d31;background:#101712;color:#bbd8c5;border-radius:999px;padding:3px 8px;font-size:10.5px;max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modelPick:active{background:#1a2a20}
.send.stop{flex-basis:48px;width:48px;font-size:11px;background:#341616;color:#ffb6b6;border:1px solid #6b2a2a}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}
.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
#composer{position:absolute;left:0;right:0;bottom:0;width:100%;box-sizing:border-box;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(9,9,11,0),rgba(9,9,11,.97) 26%);z-index:15}
.composerbox{border:1px solid var(--line2);background:#111115;border-radius:16px;padding:8px 8px 7px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#input{width:100%;min-height:38px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;line-height:1.5;padding:6px 2px}
#input::placeholder{color:#5d5d68}
.composerbar{display:flex;align-items:center;gap:7px;padding:0 2px}
.pill{font-size:10.5px;color:#9fb3a7;background:#121a15;border:1px solid #26382c;border-radius:999px;padding:3px 8px}
.pill.warn{color:#d8c58f;background:#1a1710;border-color:#3a3322}
.send{flex:0 0 34px;width:34px;height:34px;border-radius:11px;border:0;background:var(--accent);color:#08120b;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-left:auto}
.send:disabled{opacity:.35}
.footnote{text-align:center;font-size:10px;color:#55555f;margin-top:7px}
/* drawer */
#drawer{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none}
#drawer.show{display:block}
.drawerpanel{position:absolute;left:0;top:0;bottom:0;width:82%;max-width:320px;background:#0d0d10;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px calc(16px + env(safe-area-inset-bottom));animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-20px);opacity:.6}to{transform:none;opacity:1}}
.drawerpanel h3{font-size:12px;color:var(--muted);font-weight:600;margin:4px 6px 10px;letter-spacing:.5px}
#sessionList{flex:1;overflow:auto}
.sess{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:9px;color:#cfcfd8;font-size:12.5px;margin-bottom:2px}
.sess:active,.sess.active{background:#1a1a20}
.sess span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess i{font-style:normal;color:#666673;font-size:15px;padding:2px 4px}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #294232;background:#111a14;color:#c6f0d5;border-radius:10px;padding:11px;font-size:13px;margin-bottom:14px}
/* settings */
#settings{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#settings.show{display:flex}
.shead{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line)}
.shead b{font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{border:1px solid var(--line);background:var(--panel);color:#a7a7b4;border-radius:999px;padding:7px 11px;font-size:11.5px;white-space:nowrap}
.tabs button.active{color:#d9ffe6;border-color:#3b5a47;background:#132019}
#settingsBody{flex:1;overflow-y:auto;padding:16px 14px calc(22px + env(safe-area-inset-bottom))}
.section h2{font-size:13px;margin:0 0 5px;font-weight:650}
.section .desc{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:#a8a8b6;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:#131318;border:1px solid #2a2a33;border-radius:10px;padding:10px 11px;font-size:12.5px;outline:0;color:var(--text)}
.field textarea{min-height:70px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#3c6a50}
.row{display:flex;gap:9px}.row>*{flex:1}
.btn{border:1px solid #30303a;background:#191920;color:#d6d6df;border-radius:10px;padding:10px 13px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07120b;font-weight:650}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.note{border:1px solid #29382e;background:#101711;border-radius:10px;padding:10px 12px;color:#a9c9b4;font-size:11.5px;line-height:1.6;margin:12px 0}
.note.warn{border-color:#3c3321;background:#17140d;color:#d8c38f}
.memitem{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 11px;margin-bottom:8px}
.memitem .mt{font-size:12.5px;line-height:1.5;color:#dfdfe7}
.memitem .mm{font-size:10.5px;color:#747482;margin-top:6px;display:flex;gap:10px}
.memitem button{float:right;border:0;background:#1d1d24;color:#a9a9b5;border-radius:7px;font-size:10.5px;padding:5px 7px}
.statusline{font-size:11.5px;color:#9b9ba8;background:#111115;border:1px solid var(--line);border-radius:9px;padding:9px 10px;white-space:pre-wrap;word-break:break-all;margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1d1d24;font-size:12px;color:#c8c8d2}
.kv span:first-child{flex:0 0 auto;white-space:nowrap}
.kv span:last-child{color:#8d8d9b;text-align:right;min-width:0}
/* ask modal */
#modelSheet{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;padding:0}
#modelSheet.show{display:flex}
#modelSheet .askbox{border-radius:18px 18px 0 0;max-width:520px;margin-bottom:0}
#ask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:24px}
#ask.show{display:flex}
.askbox{width:100%;max-width:360px;background:#111116;border:1px solid #30303a;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.askbox h3{margin:0 0 6px;font-size:15px}
.askbox p{color:#b6b6c2;font-size:12.5px;line-height:1.6;margin:0 0 14px;white-space:pre-wrap}
.askbox button{width:100%;text-align:left;margin-bottom:8px;border:1px solid #2e2e38;background:#191920;color:#e4e4ec;border-radius:10px;padding:11px 12px;font-size:12.5px}
.askbox button:active{background:#22222b}
.askbox .cancel{text-align:center;color:#888896;background:transparent;border:0;margin-top:2px}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#20202a;border:1px solid #363642;color:#e8e8ef;padding:9px 13px;border-radius:999px;font-size:12px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1}
@media(max-width:480px){.brand small{display:none}}
@media(min-width:760px){#chat{padding-left:max(16px,calc(50% - 360px));padding-right:max(16px,calc(50% - 360px))}#composer .composerbox{max-width:760px;margin:0 auto}}
</style>
</head>
<body>
<div id="top">
  <div class="logo" id="logo">A</div>
  <div class="brand"><b>DeepSeek Mobile</b><small>手机原生工作台 · 不依赖电脑</small></div>
  <div class="spacer"></div>
  <div class="modechip hidden" id="taskChip">工作中</div>
  <div class="modechip" id="modeChip">未配置模型</div>
  <button class="iconbtn" id="btnHistory" aria-label="历史">☰</button>
  <button class="iconbtn" id="btnSettings" aria-label="设置">⚙</button>
</div>
<div id="subbar">
  <div class="modes" id="modeTabs">
    <button data-mode="lean">精简<small>少步骤</small></button>
    <button data-mode="fast">极速<small>最快出结果</small></button>
    <button data-mode="create">创造<small>写方案/页面</small></button>
    <button data-mode="model">建模<small>结构/代码</small></button>
  </div>
  <div class="wsbar" id="wsBar">📁 工作目录 <b>未选择</b><span>选择 ›</span></div>
</div>
<div id="main">
  <div id="chat"></div>
  <div id="composer">
    <div class="composerbox">
      <textarea id="input" placeholder="描述你要在手机上完成的事…"></textarea>
      <div class="composerbar">
        <button class="iconbtn" id="btnAttach" title="附加文本文件" style="width:28px;height:28px;flex-basis:28px;font-size:15px">＋</button>
        <span class="pill hidden" id="attachPill"></span>
        <button id="modelPick" title="选择模型">模型</button>
        <span class="pill" id="enginePill">云端 API</span>
        <span class="pill" id="memPill">记忆 0</span>
        <button class="send" id="btnSend">↑</button>
      </div>
    </div>
    <div class="footnote">任务状态会显示在通知栏/悬浮窗；验证码与支付请本人完成</div>
  </div>
</div>

<div id="drawer">
  <div class="drawerpanel">
    <button class="newbtn" id="btnNew">＋ 新建任务</button>
    <h3>任务</h3>
    <div id="sessionList"></div>
    <div style="border-top:1px solid #22222a;padding-top:12px;color:#6f6f7c;font-size:11px;line-height:1.6">DeepSeek Mobile · ETC<br>本地文件在应用私有目录</div>
  </div>
</div>

<div id="settings">
  <div class="shead"><button class="iconbtn" id="btnCloseSettings">←</button><b>设置</b><div class="spacer"></div><span style="font-size:11px;color:#777784" id="settingsVersion">1.4.0</span></div>
  <div class="tabs" id="tabs">
    <button data-tab="model" class="active">模型服务</button>
    <button data-tab="local">本地 GGUF</button>
    <button data-tab="runs">任务</button>
    <button data-tab="terminal">终端</button>
    <button data-tab="memory">记忆</button>
    <button data-tab="skills">技能</button>
    <button data-tab="plugins">插件</button>
    <button data-tab="qq">QQ 助手</button>
    <button data-tab="bili">B站</button>
    <button data-tab="stats">状态</button>
    <button data-tab="ability">能力</button>
    <button data-tab="tools">工作目录</button>
    <button data-tab="about">关于</button>
  </div>
  <div id="settingsBody"></div>
</div>

<div id="modelSheet"><div class="askbox" id="modelSheetBox"></div></div>
<div id="ask"><div class="askbox" id="askBox"></div></div>
<div id="processSheet"><div class="pbox"><div class="phead"><button class="pclose" onclick="closeProcess()">×</button><h3>思考过程</h3><span style="width:28px"></span></div><div id="processBody"></div></div></div>
<div id="toast"></div>

<script>

  current = sess; busy = true; stopRequested = false;

  sess.messages.push({ role: "user", content: text });

  const run = startRun(text);
  let answer = "";

    const result = settings.mode === "local" ? await runLocal(text) : await runCloud(text);
    answer = result.text || "（没有返回内容）";
    const qqProcess = sess.messages.slice(-30).filter(m => m.role === "work");

    finishRun("done", answer);

  qqBusy = false;
}

// ---------- memory ----------
const HL = [0, 0.7, 2, 7, 30, 120];
function memStrength(m) {
  const base = m.lastRecallAt || m.createdAt || now();
  const days = (now() - base) / 86400000;
  return Math.pow(0.5, days / HL[Math.min(5, Math.max(1, m.importance || 3))]);
}
function memSave(text, importance) {
  text = String(text || "").trim().replace(/^(请)?记住[：:，,]?\s*/, "").replace(/^记一下[：:，,]?\s*/, "");
  if (!text) return "";
  const exist = memories.find(m => m.text === text);
  if (exist) { exist.lastRecallAt = now(); exist.recallCount = (exist.recallCount || 0) + 1; return exist.id; }
  const m = { id: "m_" + uid(), text: text.slice(0, 800), importance: Math.min(5, Math.max(1, Number(importance) || 3)), createdAt: now(), lastRecallAt: now(), recallCount: 0 };
  memories.unshift(m); persist(); updateTop(); renderSettings(); return m.id;
}
function memSearch(q, limit) {
  const words = String(q || "").toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 1);
  return memories.map(m => {
    const t = m.text.toLowerCase(); let score = memStrength(m) * (0.6 + 0.08 * (m.importance || 3));
    if (words.length) { let hits = 0; for (const w of words) if (t.includes(w)) hits++; score += hits * 0.6; }
    return { m, score };
  }).sort((a, b) => b.score - a.score).slice(0, limit || 8).map(x => { x.m.lastRecallAt = now(); x.m.recallCount = (x.m.recallCount || 0) + 1; return x.m; });
}
function memContext(q) {
  const hit = memSearch(q, 4).filter(m => memStrength(m) > 0.25);
  if (!hit.length) return "";
  return "\n\n[长期记忆，可能有用，未必完全准确]\n" + hit.map(m => "- " + m.text).join("\n");
}
function observeMemory(text) {
  if (/^(我叫|我的名字|我喜欢|我的.*是|记住|记一下)/.test(String(text).trim())) memSave(text, 3);
}

// ---------- MCP plugins (remote HTTP) ----------
function mcpServers() {
  if (!Array.isArray(settings.mcpServers)) settings.mcpServers = [];
  if (!settings.mcpServers.length && settings.mcpUrl) {
    settings.mcpServers = [{ id: "default", url: settings.mcpUrl, token: settings.mcpToken || "", name: settings.mcpUrl, tools: Array.isArray(settings.mcpTools) ? settings.mcpTools : [] }];
  }
  return settings.mcpServers;
}
function mcpAllTools() {
  return mcpServers().flatMap(srv => (srv.tools || []).map(t => Object.assign({}, t, { serverId: srv.id, serverUrl: srv.url, serverName: srv.name || srv.url })));
}
function mcpHeaders(server) {
  const h = { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" };
  const token = server ? server.token : settings.mcpToken;
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}
function mcpParse(body) {
  const t = String(body || "").trim();
  if (!t) throw new Error("MCP 没有返回内容");
  try { return JSON.parse(t); } catch (e) {}
  const lines = t.split(/\n/).filter(x => x.startsWith("data:")).map(x => x.slice(5).trim()).filter(Boolean);
  for (const line of lines) { try { const o = JSON.parse(line); if (o && (o.result || o.error)) return o; } catch (e) {} }
  throw new Error("MCP 返回无法解析：" + t.slice(0, 200));
}
async function mcpRpc(method, params, server) {
  const srv = server || mcpServers().find(x => x.url === settings.mcpUrl) || mcpServers()[0];
  if (!srv || !srv.url) throw new Error("先填 MCP 地址");
  const r = await http("POST", srv.url, mcpHeaders(srv), JSON.stringify({ jsonrpc: "2.0", id: uid(), method: method, params: params || {} }));
  if (r.status === 0) throw new Error(r.error || "连不上 MCP");
  if (r.status >= 400) throw new Error("MCP HTTP " + r.status);
  const data = mcpParse(r.body);
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.result || {};
}
function mcpWrapper(srv, tool) {
  return "mcp__" + String(srv.id).replace(/[^a-zA-Z0-9_]/g, "_") + "__" + String(tool.name).replace(/[^a-zA-Z0-9_]/g, "_");
}
function mcpToolDefs() {
  return mcpAllTools().map(t => ({ type: "function", function: {
    name: mcpWrapper({ id: t.serverId }, t),
    description: ("[" + (t.serverName || "MCP") + "] " + (t.description || t.name || "MCP 工具")).slice(0, 220),
    parameters: t.inputSchema || { type: "object", properties: {} }
  } }));
}
function mcpFindCall(wrapped) {
  for (const srv of mcpServers()) for (const tool of (srv.tools || [])) {
    if (mcpWrapper(srv, tool) === wrapped) return { server: srv, tool };
  }
  return null;
}
async function mcpCall(wrapped, args) {
  const hit = mcpFindCall(wrapped);
  if (!hit) throw new Error("插件工具不存在：" + wrapped);
  const r = await mcpRpc("tools/call", { name: hit.tool.name, arguments: args || {} }, hit.server);
  const parts = (r.content || []).map(x => x.text || (x.type === "image" ? "[图片]" : "")).filter(Boolean);
  return parts.join("\n") || JSON.stringify(r).slice(0, 8000);

async function mcpConnect(silent) {
  const url = ($("#mcpUrl") ? $("#mcpUrl").value : settings.mcpUrl || "").trim();
  const token = ($("#mcpToken") ? $("#mcpToken").value : settings.mcpToken || "").trim();
  if (!url) throw new Error("先填 MCP HTTPS 地址");
  if (!/^https:\/\//.test(url)) throw new Error("MCP 地址必须是 HTTPS");
  const servers = mcpServers();
  let srv = servers.find(x => x.url === url);
  if (!srv) { srv = { id: "srv_" + uid(), url: url, token: token, name: url.replace(/^https:\/\//, "").slice(0, 40), tools: [] }; servers.push(srv); }
  srv.token = token; srv.url = url;
  await mcpRpc("initialize", { protocolVersion: "2025-03-26", capabilities: {}, clientInfo: { name: "deepseek-mobile", version: "2.0.0" } }, srv);
  try { await mcpRpc("notifications/initialized", {}, srv); } catch (e) {}
  const r = await mcpRpc("tools/list", {}, srv);
  srv.tools = (r.tools || []).map(t => ({ name: t.name, description: t.description || "", inputSchema: t.inputSchema || null }));
  settings.mcpServers = servers;
  settings.mcpUrl = url; settings.mcpToken = token;
  settings.mcpTools = mcpAllTools();
  persist(); updateTop();
  if (!silent) toast("已连接，当前共 " + mcpAllTools().length + " 个插件工具");
  return srv.tools;
}
async function mcpMarketSearch(q) {
  const url = "https://registry.modelcontextprotocol.io/v0/servers?limit=20" + (q ? "&search=" + encodeURIComponent(q) : "");
  const r = await http("GET", url, { "Accept": "application/json" }, null);
  if (r.status === 0) throw new Error(r.error || "连不上注册表");
  if (r.status >= 400) throw new Error("注册表 HTTP " + r.status);
  const data = JSON.parse(r.body);
  const out = [];
  for (const row of (data.servers || [])) {
    const v = row.server || row;
    for (const rem of (v.remotes || [])) {
      if (rem && rem.url && /^https:\/\//.test(rem.url)) out.push({ name: v.title || v.name || rem.url, desc: v.description || "", url: rem.url, source: "MCP 注册表" });
    }
  }
  return out.slice(0, 12);
}

// ---------- ask user ----------
function askUser(question, options) {
  return new Promise((resolve) => {
    const box = $("#askBox");
    box.innerHTML = `<h3>需要你选择</h3><p>${esc(question)}</p>` +
      (options && options.length ? options.map((o, i) => `<button data-a="${i}">${esc(o)}</button>`).join("") : `<div class="field"><input id="askInput" placeholder="输入回答"></div><button data-a="input" class="primary">确定</button>`) +
      `<button class="cancel" data-a="cancel">取消</button>`;
    $("#ask").classList.add("show");
    const done = (v) => { $("#ask").classList.remove("show"); resolve(v); };
    box.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      const k = b.dataset.a;
      if (k === "cancel") done("用户取消了选择");
      else if (k === "input") done(($("#askInput").value || "").trim() || "用户未输入");
      else done(options[Number(k)]);
    });
  });
}

// ---------- agent ----------
function allSkills() { return SKILLS.concat(settings.customSkills || []); }
function normalizeSkillIds() {
  if (!Array.isArray(settings.skillIds)) settings.skillIds = [];
  const existing = allSkills().map(k => k.id);
  settings.skillIds = settings.skillIds.filter(id => existing.includes(id));
  if (!settings.skillIds.length) settings.skillIds = ["auto"];
  settings.skillId = settings.skillIds[0];
}
function isSkillEnabled(id) { return (settings.skillIds || []).includes(id); }
function activeSkills() {
  normalizeSkillIds();
  return settings.skillIds.map(id => allSkills().find(k => k.id === id)).filter(Boolean);
}
function activeSkill() { normalizeSkillIds(); return activeSkills()[0] || SKILLS[0]; }
function toggleSkill(id) {
  normalizeSkillIds();
  if (isSkillEnabled(id)) settings.skillIds = settings.skillIds.filter(x => x !== id);
  else settings.skillIds.push(id);
  if (!settings.skillIds.length) settings.skillIds = ["auto"];
  settings.skillId = settings.skillIds[0];
  persist(); updateTop(); renderSettings();
}
function enableAllSkills() {
  settings.skillIds = allSkills().map(k => k.id);
  settings.skillId = settings.skillIds[0] || "auto";
  persist(); updateTop(); renderSettings(); toast("已启用全部 " + settings.skillIds.length + " 个技能");
}

}

function apiUrl() {
  let base = (settings.baseUrl || "").trim().replace(/\/+$/, "");
  if (!base) return "";
  if (base.endsWith("/chat/completions")) return base;
  return base + "/chat/completions";
}

function toolStep(name, args) {
  args = args || {};
  if (name === "open_app_search") return `打开 ${args.app || "App"}，搜索「${args.query || ""}」`;
  if (name === "open_app") return `打开应用 ${args.name || ""}`;
  if (name === "open_url") return `打开网页 ${args.url || ""}`;
  if (name === "http_fetch") return `读取网页 ${args.url || ""}`;
  if (name === "write_file") return `写入文件 ${args.name || "file.txt"}`;
  if (name === "read_file") return `读取文件 ${args.name || ""}`;
  if (name === "create_ppt") return `生成 PPT ${args.name || "presentation.pptx"}（${(args.slides || []).length} 页）`;
  if (name === "screen_read") return "读取当前屏幕";
  if (name === "screen_find") return `查找屏幕控件「${args.text || ""}」`;
  if (name === "screen_tap_text") return `点击「${args.text || ""}」`;
  if (name === "screen_input") return `输入「${args.text || ""}」`;
  if (name === "screen_enter") return "按回车/搜索";
  if (name === "shell_exec") return `执行命令 ${String(args.command || "").slice(0, 90)}`;
  if (name === "memory_save") return "写入长期记忆";
  if (name === "memory_search") return `搜索记忆「${args.query || ""}」`;
  if (name === "ask_user") return "询问你的选择";
  return name;
}

async function runCloud(userText) {
  const url = apiUrl();
  if (!url || !settings.model) throw new Error("请先在设置里填写 API 地址和模型名");
  const messages = [{ role: "system", content: systemPrompt() }];
  for (const m of current.messages) {
    if (m.role === "user" || m.role === "assistant") messages.push({ role: m.role, content: m.modelContent || m.content });
  }
  const headers = { "Content-Type": "application/json" };
  if (settings.apiKey) headers["Authorization"] = "Bearer " + settings.apiKey;
  const toolsUsed = [];
  const rounds = thinkCfg().rounds;
  for (let round = 0; round < rounds; round++) {
    const body = JSON.stringify({
      model: settings.model, messages, tools: TOOL_DEFS.concat(mcpToolDefs()), tool_choice: "auto",
      temperature: modeOf().temp, max_tokens: modeOf().maxTokens, stream: false
    });
    setStatus(round ? "继续处理工具结果…" : "模型思考中…"); updateRun(round ? "继续处理工具结果" : "模型思考中");
    const r = await http("POST", url, headers, body);
    if (stopRequested) throw new Error("用户结束了任务");
    if (r.status === 0) throw new Error(r.error || "网络请求失败");
    if (r.status >= 400) throw new Error("API " + r.status + "：" + (r.body || "").slice(0, 400));
    let data; try { data = JSON.parse(r.body); } catch (e) { throw new Error("API 返回不是 JSON：" + r.body.slice(0, 200)); }
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const msg = data.choices && data.choices[0] && data.choices[0].message;
    if (!msg) throw new Error("API 没有返回 message");
    const think = String(msg.reasoning_content || msg.reasoning || msg.thinking || "").trim();
    if (think) addWorkLog("思考：" + think.replace(/\s+/g, " ").slice(0, 240), "think");
    const calls = msg.tool_calls || [];
    if (calls.length) addWorkLog("模型决定执行 " + calls.length + " 个工具");
    if (calls.length) {
      messages.push({ role: "assistant", content: msg.content || "", tool_calls: calls });
      for (const c of calls) {
        const name = c.function && c.function.name;
        let args = {}; try { args = JSON.parse(c.function.arguments || "{}"); } catch (e) {}
        setStatus("执行工具：" + name); updateRun("执行工具：" + toolStep(name, args));
        const res = await execTool(name, args);
        if (stopRequested) throw new Error("用户结束了任务");
        addWorkLog("工具 " + name + " 完成：" + String(res.detail || res.text || "").replace(/\s+/g, " ").slice(0, 140));
        toolsUsed.push({ name, detail: res.detail || "" });
        messages.push({ role: "tool", tool_call_id: c.id, content: res.text });
      }
      continue;
    }
    return { text: msg.content || "", tools: toolsUsed };
  }
  throw new Error("工具调用轮次过多，已停止");
}

function parseToolJson(text) {
  const t = String(text || "").trim();
  const m = t.match(/\{[\s\S]*"tool"[\s\S]*\}/);
  if (!m) return null;
  try { const o = JSON.parse(m[0]); return o && o.tool ? o : null; } catch (e) { return null; }
}

async function ensureLocalReady() {
  const a = android();
  if (!a) throw new Error("当前不在 Android 环境");
  if (settings.localLoaded) {
    try { if (a.localReady && a.localReady()) return; } catch (e) {}
  }
  if (!settings.localPath) throw new Error("还没有选择 GGUF 模型，请到 设置 → 本地 GGUF 选择模型");
  if (!settings.localLoading) maybeAutoLoadLocal(true);
  setStatus("本地模型加载中，任务已排队…");
  updateRun("等待本地模型加载");
  for (let i = 0; i < 180; i++) {
    try {
      if (a.localReady && a.localReady()) {
        settings.localLoaded = true; settings.localLoading = false; settings.localError = "";
        persist(); updateTop(); renderSettings(); return;
      }
    } catch (e) {}
    if (!settings.localLoading && settings.localError) throw new Error(settings.localError);
    await new Promise(r => setTimeout(r, 500));
  }
  throw new Error(settings.localError || "本地模型加载超时；请到 设置 → 本地 GGUF 点“加载/重载”，或换小一点的模型");
}

async function runLocal(userText) {
  await ensureLocalReady();
  const roles = ["system"], contents = [localSystem()];
  for (const m of current.messages) { if (m.role === "work") continue; roles.push(m.role === "user" ? "user" : "assistant"); contents.push(m.modelContent || m.content); }
  const toolsUsed = [];
  const rounds = settings.localUnlimited ? 40 : thinkCfg().rounds;
  for (let round = 0; round < rounds; round++) {
    setStatus(round ? "本地模型继续处理…" : "本地模型生成中…"); updateRun(round ? "本地模型继续处理" : "本地模型生成中");
    const r = await localChat(roles, contents, Math.max(modeOf().maxTokens, thinkCfg().tokens));
    if (stopRequested) throw new Error("用户结束了任务");
    if (r.error) throw new Error(r.error);
    const call = parseToolJson(r.text);
    if (!call) { addWorkLog("本地模型已生成最终回答"); return { text: r.text.trim(), tools: toolsUsed }; }
    setStatus("执行工具：" + call.tool); updateRun("执行工具：" + toolStep(call.tool, call.args || {}));
    addWorkLog("调用工具 " + call.tool);
    const res = await execTool(call.tool, call.args || {});
    if (stopRequested) throw new Error("用户结束了任务");
    addWorkLog("工具 " + call.tool + " 完成：" + String(res.detail || res.text || "").replace(/\s+/g, " ").slice(0, 140));
    toolsUsed.push({ name: call.tool, detail: res.detail || "" });
    roles.push("assistant"); contents.push(r.text);
    roles.push("user"); contents.push("工具 " + call.tool + " 的结果：\n" + res.text + "\n请继续完成，或直接给出最终回答。");
  }
  return { text: "本地模型工具轮次过多，已停止", tools: toolsUsed };
}

function pptRequest(text) { return /\bppt\b|幻灯片|演示文稿|slides/i.test(String(text || "")); }
function pptBriefScore(text) {
  const t = String(text || "");
  return [/\d+\s*(页|张)|页数|p\d+/i.test(t), /受众|客户|领导|同事|听众|学生|老板/.test(t), /风格|简约|简洁|商务|科技|创意|活泼|正式/.test(t), /主题|关于|介绍|汇报|方案|产品|项目|教学/.test(t)].filter(Boolean).length;
}
async function collectPptBrief(text) {
  if (!pptRequest(text) || pptBriefScore(text) >= 3) return "";
  const parts = [];
  const topicGiven = /主题|关于|介绍|汇报|方案|产品|项目|教学/.test(text);
  if (!topicGiven) {
    const t = await askUser("这份 PPT 的主题或用途是什么？", []);
    if (!t || t === "用户取消了选择") return null;
    parts.push("主题/用途：" + t);
  }
  if (!/\d+\s*(页|张)|页数/.test(text)) {
    const p = await askUser("大约做多少页？", ["5–8 页", "10–12 页", "15 页以上"]);
    if (!p || p === "用户取消了选择") return null;
    parts.push("页数：" + p);
  }
  if (!/受众|客户|领导|同事|听众|学生|老板/.test(text)) {
    const a = await askUser("主要给谁看？", ["内部汇报", "客户/领导", "教学/分享"]);
    if (!a || a === "用户取消了选择") return null;
    parts.push("受众：" + a);
  }
  if (!/风格|简约|简洁|商务|科技|创意|活泼|正式/.test(text)) {
    const st = await askUser("希望什么风格？", ["简洁商务", "科技感", "创意活泼"]);
    if (!st || st === "用户取消了选择") return null;
    parts.push("风格：" + st);
  }
  return parts.length ? "\n[PPT 需求确认]\n" + parts.join("\n") : "";
}

async function send() {
  if (busy) return;
  let text = $("#input").value.trim();
  if (!text && !pendingAttach) return;
  let brief = "";
  if (text && pptRequest(text)) {
    brief = await collectPptBrief(text);
    if (brief === null) { toast("已取消 PPT 任务"); return; }
    if (brief) text += brief;
  }
  const attach = pendingAttach;
  $("#input").value = ""; $("#input").style.height = "auto";
  const shown = text + (attach ? (text ? "\n" : "") + "📎 " + attach.name : "");
  const full = text + (attach ? "\n\n[用户附加的文件：" + attach.name + "]\n" + attach.text.slice(0, 120000) : "");
  pendingAttach = null; $("#attachPill").classList.add("hidden");
  addMsg("user", shown, [], full);
  const workStart = current.messages.length;
  addWorkLog("分析任务，制定执行计划");
  observeMemory(text);
  busy = true; stopRequested = false; setBusyUI(true); renderChat();
  const run = startRun(text || shown);
  try {
    const memHits = memSearch(text || shown, 4).filter(m => memStrength(m) > 0.25);
    if (memHits.length) addWorkLog(`注入长期记忆 ${memHits.length} 条`);
    addWorkLog(`启用技能：${activeSkills().map(k => k.name).join("、") || "自动"} · 模式：${modeOf().name}`);
    updateRun("已提交任务");
    const result = settings.mode === "local" ? await runLocal(text || shown) : await runCloud(text || shown);
    busy = false; setBusyUI(false);
    const process = current.messages.slice(workStart).filter(m => m.role === "work");
    const elapsed = run && run.start ? now() - run.start : 0;
    addMsg("assistant", result.text || "（没有返回内容）", result.tools, null, process, elapsed);
    finishRun("done", result.text || "没有返回内容");
  } catch (e) {
    busy = false; setBusyUI(false);
    const process = current.messages.slice(workStart).filter(m => m.role === "work");
    const elapsed = run && run.start ? now() - run.start : 0;
    if (stopRequested) { addMsg("assistant", "任务已结束。", [], null, process, elapsed); finishRun("stopped", "用户结束了任务"); }
    else { addMsg("assistant", "出错了：" + e.message, [], null, process, elapsed); finishRun("error", e.message); }
  }
  renderChat(); updateTop();
}

function bindSettings() {
  const bind = (id, ev, fn) => { const el = $("#" + id); if (el) el[ev] = fn; };
  bind("setMode", "onchange", e => { settings.mode = e.target.value; persist(); updateTop(); if (settings.mode === "local") setTimeout(maybeAutoLoadLocal, 200); });
  bind("setWork", "onchange", e => { settings.workMode = e.target.value; persist(); updateTop(); toast("已切换到" + modeOf().name + "模式"); });
  bind("setThink", "onchange", e => { settings.thinkLevel = e.target.value; persist(); updateTop(); toast("AI 思考等级：" + thinkCfg().name); });
  bind("saveModel", "onclick", () => {
    settings.baseUrl = ($("#setBase").value || "").trim(); settings.apiKey = ($("#setKey").value || "").trim();
    settings.model = ($("#setModel").value || "").trim(); settings.thinkLevel = ($("#setThink").value || "advanced");
    settings.temperature = Number($("#setTemp").value) || 0.6;
    settings.maxTokens = Number($("#setMax").value) || 2048;
    settings.imageUrl = ($("#setImageUrl").value || "").trim(); settings.imageKey = ($("#setImageKey").value || "").trim();
    settings.imageModel = ($("#setImageModel").value || "").trim(); persist(); updateTop(); toast("已保存");
  });
  bind("pickModel", "onclick", () => { if (android()) android().pickModel("pick"); else toast("不在 Android 环境"); });
  bind("pickModel2", "onclick", () => { if (android()) android().pickModel("pick"); else toast("不在 Android 环境"); });
  bind("loadModel", "onclick", () => { settings.localCtx = Number($("#setCtx").value) || 2048; settings.localThreads = Number($("#setThreads").value) || 4; persist(); loadLocal(); });
  bind("autoLocal", "onchange", e => { settings.autoLoadLocal = !!e.target.checked; persist(); if (settings.autoLoadLocal && settings.localPath) setTimeout(maybeAutoLoadLocal, 200); });
  bind("localUnlimited", "onchange", e => { settings.localUnlimited = !!e.target.checked; persist(); toast(e.target.checked ? "本地长任务已开启（最多40轮）" : "已恢复按思考等级限制"); });
  bind("unloadModel", "onclick", () => { if (android()) android().unloadLocal(); settings.localLoaded = false; persist(); updateTop(); renderSettings(); toast("已卸载"); });
  bind("memAdd", "onclick", () => { const t = $("#memText").value; const imp = Number($("#memImp").value); if (memSave(t, imp)) { toast("已记住"); renderSettings(); } });
  bind("memSearch", "onclick", () => { const q = $("#memQuery").value; const hit = memSearch(q, 10); $("#memList").innerHTML = hit.map(m => `<div class="memitem"><button data-forget="${m.id}">忘记</button><div class="mt">${esc(m.text)}</div><div class="mm"><span>重要度 ${m.importance}/5</span><span>强度 ${memStrength(m).toFixed(2)}</span><span>回想 ${m.recallCount || 0} 次</span></div></div>`).join("") || `<div class="note">没有找到</div>`; bindForgets(); });
  bind("skillSearch", "oninput", e => {
    const q = String(e.target.value || "").trim().toLowerCase();
    skillQuery = e.target.value || "";
    document.querySelectorAll("#skillList [data-skill-name]").forEach(el => { el.style.display = (!q || el.dataset.skillName.includes(q)) ? "" : "none"; });
  });
  document.querySelectorAll("[data-use-skill]").forEach(b => b.onclick = () => { toggleSkill(b.dataset.useSkill); toast(isSkillEnabled(b.dataset.useSkill) ? "已停用技能" : "已启用技能"); });
  bind("skillAll", "onclick", () => enableAllSkills());
  bind("skillNone", "onclick", () => { settings.skillIds = ["auto"]; settings.skillId = "auto"; persist(); updateTop(); renderSettings(); toast("已只保留自动技能"); });
  document.querySelectorAll("[data-del-skill]").forEach(b => b.onclick = () => { settings.customSkills = (settings.customSkills || []).filter(x => x.id !== b.dataset.delSkill); if (settings.skillId === b.dataset.delSkill) settings.skillId = "auto"; persist(); renderSettings(); });

  bind("overlayPerm", "onclick", () => { if (!android()) return toast("不在 Android 环境"); toast(android().openOverlaySettings()); });

  bind("importSkill", "onclick", () => pickText("skill"));
  bind("termCwd", "onchange", e => { settings.terminalCwd = (e.target.value || "").trim(); persist(); toast("已保存终端目录"); });
  bind("termRun", "onclick", () => { const a = android(); if (!a || !a.shellExec) return toast("当前版本不支持终端"); settings.terminalCwd = ($("#termCwd") ? $("#termCwd").value.trim() : settings.terminalCwd); persist(); $("#termOut").textContent = "运行中…"; $("#termOut").textContent = a.shellExec($("#termCmd").value || "", settings.terminalCwd || ""); });
  bind("biliLogin", "onclick", () => { const a=android(); if(!a) return toast("不在 Android 环境"); a.openUrl("https://passport.bilibili.com/login"); $("#biliStatus").textContent="已在官方页面打开登录；请本人完成手机号/验证码或第三方登录"; });
  bind("biliHome", "onclick", () => { const a=android(); if(!a) return toast("不在 Android 环境"); a.openUrl("https://www.bilibili.com"); $("#biliStatus").textContent="已打开 B站首页"; });
  bind("biliApp", "onclick", () => { const a=android(); if(!a) return toast("不在 Android 环境"); $("#biliStatus").textContent=a.openApp("bilibili"); });
  bind("biliSearch", "onclick", () => { const a=android(); if(!a) return toast("不在 Android 环境"); const q=($("#biliQuery")&&$("#biliQuery").value.trim())||"编程"; a.openUrl("https://search.bilibili.com/all?keyword="+encodeURIComponent(q)); $("#biliStatus").textContent="已打开 B站搜索："+q; });
  bind("biliScreen", "onclick", () => { const a=android(); if(!a) return toast("不在 Android 环境"); const r=a.screenRead(); $("#biliStatus").textContent=String(r).slice(0,1800); });
  bind("qqTest", "onclick", qqTest);
  bind("qqStart", "onclick", qqStart);
  bind("qqStop", "onclick", qqStop);
  bind("mcpConnect", "onclick", async () => {
    const st = $("#mcpStatus"); st.textContent = "连接中…";
    try { const tools = await mcpConnect(true); st.textContent = "已连接 " + tools.length + " 个工具"; renderSettings(); toast("MCP 已连接"); }
    catch (e) { st.textContent = "连接失败：" + e.message; }
  });
  bind("mcpSearch", "onclick", async () => {
    const box = $("#mcpMarket"); box.innerHTML = `<div class="note">搜索中…</div>`;
    try {
      const items = await mcpMarketSearch($("#mcpQuery").value.trim());
      box.innerHTML = items.length ? items.map((x, i) => `<div class="memitem"><button data-mcp-url="${esc(x.url)}">填入地址</button><div class="mt">${esc(x.name)}</div><div class="mm"><span>${esc(x.desc.slice(0, 120))}</span></div></div>`).join("") : `<div class="note">没有找到可直接连接的远程服务</div>`;
      box.querySelectorAll("[data-mcp-url]").forEach(b => b.onclick = () => { $("#mcpUrl").value = b.dataset.mcpUrl; toast("已填入地址，点连接"); });
    } catch (e) { box.innerHTML = `<div class="note">搜索失败：${esc(e.message)}</div>`; }
  });
  document.querySelectorAll("[data-del-mcp]").forEach(b => b.onclick = () => {
    settings.mcpServers = mcpServers().filter(x => x.id !== b.dataset.delMcp);
    settings.mcpTools = mcpAllTools(); persist(); updateTop(); renderSettings(); toast("已断开插件服务");
  });
  bind("grantPerm", "onclick", () => { const a = android(); if (a && a.requestPermissions) a.requestPermissions(); else toast("不在 Android 环境"); });
  bind("enableAcc", "onclick", () => { if (android()) $("#screenTest").textContent = android().openAccessibility(); else toast("不在 Android 环境"); });
  bind("testScreen", "onclick", () => { if (android()) $("#screenTest").textContent = android().screenRead().slice(0, 2500); else toast("不在 Android 环境"); });
  bind("listAppsBtn", "onclick", () => { const a=android(); if(!a) return toast("不在 Android 环境"); try { const d=JSON.parse(a.listApps()||"{}"); $("#screenTest").textContent=(d.apps||[]).map(x=>x.name+"  ("+x.package+")").join("\n")||"没有读到应用"; } catch(e){ $("#screenTest").textContent="读取失败："+e.message; } });
  bind("pickWorkspace", "onclick", () => pickWorkspace());
  bind("clearWorkspace", "onclick", () => { settings.workspaceName = ""; settings.workspaceUri = ""; persist(); updateTop(); renderSettings(); toast("已清除工作目录"); });
  bind("refreshFiles", "onclick", () => { const a = android(); if (!a) return; try { const arr = JSON.parse(settings.workspaceUri ? a.wsList() : a.listFiles()); $("#fileList").textContent = (settings.workspaceUri ? "[" + settings.workspaceName + "]\n" : "[应用私有]\n") + (arr.map(f => f.name + "  " + bytes(f.size)).join("\n") || "目录为空"); } catch (e) { $("#fileList").textContent = "读取失败：" + e.message; } });
  bind("checkUpdate", "onclick", async () => {
    $("#updateInfo").textContent = "检查中…";
    const r = await http("GET", "https://api.github.com/repos/ETQWFD/deepseek-mobile/releases/latest", { "Accept": "application/vnd.github+json" }, null);
    try { const d = JSON.parse(r.body); $("#updateInfo").textContent = d.tag_name ? ("最新 Release：" + d.tag_name + "\n" + (d.html_url || "")) : ("检查失败：" + (r.error || r.body.slice(0, 100))); } catch (e) { $("#updateInfo").textContent = "检查失败：" + (r.error || ""); }
  });
  bind("openRepo", "onclick", () => android() && android().openUrl("https://github.com/ETQWFD/deepseek-mobile"));
  bindForgets();
}
function bindForgets() {
  document.querySelectorAll("[data-forget]").forEach(b => b.onclick = () => {
    memories = memories.filter(m => m.id !== b.dataset.forget); persist(); updateTop(); renderSettings();
  });
}

function openSettings(tab) { currentTab = tab || "model"; $("#settings").classList.add("show"); document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab)); renderSettings(); const sb=$("#settingsBody"); if(sb) sb.scrollTop=0; }
function closeSettings() { $("#settings").classList.remove("show"); persist(); updateTop(); }

// ---------- events ----------
$("#modeTabs").onclick = (e) => { const b = e.target.closest("button[data-mode]"); if (!b) return; settings.workMode = b.dataset.mode; persist(); updateTop(); toast("已切换到" + modeOf().name + "模式"); };
$("#wsBar").onclick = () => pickWorkspace();
$("#btnNew").onclick = () => newSession();
$("#btnHistory").onclick = openDrawer;
$("#drawer").onclick = (e) => { if (e.target.id === "drawer") closeDrawer(); };
$("#btnSettings").onclick = () => openSettings("model");
$("#modelPick").onclick = openModelSheet;
$("#modelSheet").onclick = (e) => { if (e.target.id === "modelSheet") closeModelSheet(); };
$("#processSheet").onclick = (e) => { if (e.target.id === "processSheet") closeProcess(); };
$("#btnCloseSettings").onclick = closeSettings;
$("#tabs").onclick = (e) => { const b = e.target.closest("button[data-tab]"); if (!b) return; currentTab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b)); renderSettings(); };
$("#btnSend").onclick = () => { if (busy) requestStop(); else send(); };
$("#btnAttach").onclick = () => pickText("attach");
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#input").addEventListener("input", () => { const el = $("#input"); el.style.height = "auto"; el.style.height = Math.min(140, el.scrollHeight) + "px"; });
$("#chat").addEventListener("click", (e) => { const q = e.target.closest("[data-q]"); if (q) { $("#input").value = q.dataset.q; send(); } });
$("#sessionList").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]"); if (del) { e.stopPropagation(); deleteSession(del.dataset.del); return; }
  const row = e.target.closest(".sess"); if (row) openSession(row.dataset.id);
});
$("#drawer").querySelector(".drawerpanel").addEventListener("click", e => e.stopPropagation());

// init
if (android()) {
  try { if (!android().localReady || !android().localReady()) { settings.localLoading = false; settings.localLoaded = false; persist(); } } catch (e) {}
  try {
    const wi = JSON.parse(android().workspaceInfo());
    if (wi && wi.ready && !settings.workspaceUri) { settings.workspaceUri = wi.uri; settings.workspaceName = wi.name; persist(); }
    android().toast("DeepSeek Mobile 已就绪");
  } catch (e) {}
}
renderSessions(); renderChat(); updateTop();
window.__onResume = function () {
  if (settings.autoLoadLocal !== false && settings.localPath && !settings.localLoading) {
    try { if (!android().localReady || !android().localReady()) maybeAutoLoadLocal(); } catch (e) {}
  }
};
setTimeout(maybeAutoLoadLocal, 700);
if (settings.qqEnabled) setTimeout(() => qqStart(), 1200);
</script>
</body>
</html>
